name: Build iOS for Testing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15   # Use older macOS runner with Xcode 15.x (more stable for now)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      # Important: Update CocoaPods and Firebase-related packages
      - name: Update Pods
        run: |
          cd ios
          pod repo update
          pod install --repo-update

      - name: Build IPA (for testing)
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BarterX-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 7

name: Build iOS for Testing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Flutter (This must come first)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      # Clean previous build (helps avoid errors)
      - name: Clean
        run: flutter clean

      # This is the correct command
      - name: Get Dependencies
        run: flutter pub get

      # Build IPA without code signing (perfect for free Apple ID + Sideloadly)
      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      # Upload the IPA so you can download it
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BarterX-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 7

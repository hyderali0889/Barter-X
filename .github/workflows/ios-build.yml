name: Build iOS for Testing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # === FIXED Flutter Setup ===
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'     # Use a specific stable version (works better)
          # architecture: x64           # Uncomment this line if it still fails
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Clean
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Build IPA (for testing)
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BarterX-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 7
